name: reusable-build

on:
  workflow_call:
    inputs:
      node_version:
        description: 'Node.js version (e.g. 20.x). If empty, derived from package.json'
        required: false
        default: ''
        type: string

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Determine Node.js version
        id: node
        if: inputs.node_version == ''
        uses: ZaiusInc/node-sdk/.github/actions/determine-node-version@master

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version || env.node_version }}

      - name: yarn
        run: yarn

      - name: lint
        run: yarn run lint

      - name: build
        run: yarn run build

      - name: test
        run: yarn test
